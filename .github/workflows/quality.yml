name: Offline quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            requirements: requirements-dev.txt
          - python: '3.13'
            requirements: requirements-dev.txt
          - python: '3.11'
            requirements: requirements-mcp-dev.txt
    env:
      OTEL_SDK_DISABLED: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4 ref verified 2026-10-07
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # official v5 ref verified 2026-10-07
        with:
          python-version: ${{ matrix.python }}
      - name: Install hashed tooling from official PyPI
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r '${{ matrix.requirements }}'
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint and types
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
      - name: Synthetic offline contracts and financial invariants
        env:
          PYTHONPATH: tests/offline_guard
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Build and isolated wheel demo
        run: |
          python -m build --no-isolation
          python -m venv /tmp/gsd-wheel-check
          /tmp/gsd-wheel-check/bin/python -m pip install --no-index --no-deps dist/*.whl
          PYTHONPATH=tests/offline_guard /tmp/gsd-wheel-check/bin/gsd demo --format short
