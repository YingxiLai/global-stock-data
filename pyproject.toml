[build-system]
requires = ["hatchling==1.27.0", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "global-stock-data"
version = "3.0.0"
description = "Evidence-first investment research tools with explicit source policy"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
gsd = "global_stock_data.cli:main"
gsd-mcp = "global_stock_data.mcp_server:main"

[tool.hatch.build.targets.wheel.force-include]
"schemas/contracts-v1.json" = "global_stock_data/contracts-v1.json"

[dependency-groups]
dev = ["ruff==0.11.13", "mypy==1.15.0", "coverage==7.8.2", "build==1.2.2.post1", "hatchling==1.27.0", "jsonschema==4.26.0", "editables==0.6"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["global_stock_data"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[[tool.mypy.overrides]]
module = ["mcp.*", "mcp_types"]
ignore_missing_imports = true
